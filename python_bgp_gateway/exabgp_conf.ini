process bgp-ls-receiver {
    run python3 /home/bai/LEO_TE_Controller/python_bgp_gateway/bgp_ls_receiver.py;
    encoder json;
}

neighbor 10.99.0.2 { # 刚刚配的地面站内部 IP
    router-id 10.99.0.1; 
    local-address 10.99.0.1; # 刚刚配的宿主机 IP
    local-as 65000;
    peer-as 65000;
    
    capability {
        bgp-ls;
    }
    
    api {
        processes [ bgp-ls-receiver ];
        receive {
            parsed;
            update;
        }
    }
}