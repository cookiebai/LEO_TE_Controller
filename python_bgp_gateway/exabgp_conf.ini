process bgp-ls-receiver {
    run python3 /path/to/LEO_TE_Controller/python_bgp_gateway/bgp_ls_receiver.py;
    encoder json;
}

neighbor 192.168.1.1 { # 假设这是课题一的对端IP
    router-id 10.0.0.100; # 课题四控制器的 Router-ID
    local-address 192.168.1.100; # 本地监听IP
    local-as 65000;
    peer-as 65000;
    
    capability {
        bgp-ls;
    }
    
    api {
        processes [ bgp-ls-receiver ];
        receive {
            parsed;
            update;
        }
    }
}