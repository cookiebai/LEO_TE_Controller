# config/controller.yaml
redis:
  host: "127.0.0.1"
  port: 6379
  te_queue_name: "policy_queue"

te_engine:
  # 算法轮询周期 (毫秒)
  polling_interval_ms: 500
  # 拥塞阈值 (百分比)，超过此值触发集中式绕路计算
  congestion_threshold_percent: 80.0
  # 最大 SID 深度限制 (硬件限制)
  max_sid_depth: 16
  # 星历预测提前量 (秒) - 预留字段
  ephemeris_lookahead_sec: 5

network:
  # 卫星节点的 IPv6 SID 前缀 (用于生成 SRv6 报文)
  srv6_locator_prefix: "fd00:"

  # 新增: Lyapunov 优化器配置
lyapunov_engine:
  polling_interval_ms: 2000          # 求解周期 (2秒一次)
  v_parameter: 100.0                 # V 值：平衡延迟与拥塞
  max_k_paths: 3                     # KSP 算法的备选路径数量 K
  capacity_rho: 0.85                 # 链路容量切片阈值 (留下15%给C++的分布式底层流)
  
  traffic_classes:
    class_1_urllc:                   # 高优控制流
      alpha: 10.0                    # 极度敏感延迟
      beta: 0.1                      # 敢于穿透拥塞
    class_2_embb:                    # 普通宽带流
      alpha: 1.0
      beta: 1.0
    class_3_background:              # 海量后台数据流
      alpha: 0.1                     # 容忍高延迟
      beta: 10.0                     # 极度恐高，绝对避让拥塞