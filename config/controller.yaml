# config/controller.yaml
redis:
  host: "127.0.0.1"
  port: 6379
  te_queue_name: "policy_queue"

te_engine:
  # 算法轮询周期 (毫秒)
  polling_interval_ms: 500
  # 拥塞阈值 (百分比)，超过此值触发集中式绕路计算
  congestion_threshold_percent: 80.0
  # 最大 SID 深度限制 (硬件限制)
  max_sid_depth: 16
  # 星历预测提前量 (秒) - 预留字段
  ephemeris_lookahead_sec: 5

network:
  # 卫星节点的 IPv6 SID 前缀 (用于生成 SRv6 报文)
  srv6_locator_prefix: "fd00:"

  # 新增: Lyapunov 优化器配置
lyapunov_engine:
  polling_interval_ms: 5000          # 连续模式求解周期；主循环会严格休眠
  v_parameter: 100.0                 # V 值：平衡延迟与拥塞
  max_k_paths: 24                    # 为全局单路径模型提供足够的绕行候选
  capacity_rho: 0.90                 # 为 OSPF/控制流保留 10% 链路容量
  min_policy_dwell_seconds: 20       # 防止队列瞬时抖动造成路径来回切换
  max_policy_queue_len: 128
  policy_state_key: "te:policy:last_signature"
  policy_details_key: "te:policy:desired"
  policy_changed_at_key: "te:policy:changed_at"
  
  traffic_classes:
    class_1_urllc:                   # 高优控制流
      alpha: 10.0                    # 极度敏感延迟
      beta: 0.1                      # 敢于穿透拥塞
    class_2_embb:                    # 普通宽带流
      alpha: 1.0
      beta: 1.0
    class_3_background:              # 海量后台数据流
      alpha: 0.1                     # 容忍高延迟
      beta: 10.0                     # 极度恐高，绝对避让拥塞
